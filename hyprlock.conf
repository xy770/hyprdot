source = $HOME/.config/hypr/macchiato.conf
$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# ==============================================================================
# BACKGROUND
# ==============================================================================
background {
    monitor =
    path = ~/Pictures/wallpapers/the_truth_of_universe.jpg
    blur_passes = 2
    blur_size = 8
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.1
    color = $base
}
# ==============================================================================
# PARTICLES
# ==============================================================================
# Particle 1
label {
    monitor =
    text = ✦
    color = rgba(203, 166, 247, 0.4)
    font_size = 17
    font_family = $font
    position = -112, 280
    halign = center
    valign = center
}
# Particle 2
label {
    monitor =
    text = ✧
    color = rgba(245, 194, 231, 0.6)
    font_size = 11
    font_family = $font
    position = 168, -210
    halign = center
    valign = center
}
# Particle 3
label {
    monitor =
    text = ✨
    color = rgba(139, 213, 202, 0.5)
    font_size = 14
    font_family = $font
    position = -280, -140
    halign = center
    valign = center
}
# Particle 4
label {
    monitor =
    text = ⭐
    color = rgba(250, 227, 176, 0.4)
    font_size = 8
    font_family = $font
    position = 252, 210
    halign = center
    valign = center
}
# Particle 5
label {
    monitor =
    text = ◆
    color = rgba(166, 227, 161, 0.3)
    font_size = 20
    font_family = $font
    position = -210, 70
    halign = center
    valign = center
}
# ==============================================================================
# BORDERS
# ==============================================================================
label {
    monitor =
    text = ╭─────────────────────────────────────────╮
    color = rgba(203, 166, 247, 0.4)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 392
    halign = center
    valign = center
}
label {
    monitor =
    text = ╰─────────────────────────────────────────╯
    color = rgba(203, 166, 247, 0.4)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, -392
    halign = center
    valign = center
}
# ==============================================================================
# TIME
# ==============================================================================
# Time glow effect
label {
    monitor =
    text = $TIME
    color = rgba(203, 166, 247, 0.3)
    font_size = 119
    font_family = $font
    position = 3, 213
    halign = center
    valign = center
}
# Time display
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 112
    font_family = $font
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 11
    shadow_color = rgba(203, 166, 247, 0.6)
}
# ==============================================================================
# DATE
# ==============================================================================
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %d %B %Y"
    color = $subtext1
    font_size = 28
    font_family = $font
    position = 0, 112
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}
# ==============================================================================
# CURRENT LYRIC (Top Left)
# ==============================================================================
label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/scripts/lyric_query.sh | jq -r '.text' 2>/dev/null || echo "♫ No music"
    color = $pink
    font_size = 18
    font_family = $font
    position = 42, -63
    halign = left
    valign = top
    text_align = left
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(245, 194, 231, 0.3)
}
# ==============================================================================
# SYSTEM STATUS
# ==============================================================================
# CPU Usage
label {
    monitor =
    text = cmd[update:2000] echo "CPU: $(top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\) 闲.*/\1/" | awk '{print 100 - $1}' | cut -d. -f1)%"
    color = $peach
    font_size = 17
    font_family = $font
    position = -42, -49
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(250, 179, 135, 0.3)
}
# RAM Usage
label {
    monitor =
    text = cmd[update:3000] free | awk 'NR==2 {printf "RAM: %.0f%%", $3/$2 * 100.0}'
    color = $yellow
    font_size = 17
    font_family = $font
    position = -42, -77
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(250, 227, 176, 0.3)
}
# ==============================================================================
# DECORATION
# ==============================================================================
# Diamond top left
label {
    monitor =
    text = ◇
    color = rgba(203, 166, 247, 0.4)
    font_size = 42
    font_family = $font
    position = -280, 280
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(203, 166, 247, 0.2)
}
# Triangle top right
label {
    monitor =
    text = △
    color = rgba(245, 194, 231, 0.5)
    font_size = 35
    font_family = $font
    position = 280, 280
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 7
    shadow_color = rgba(245, 194, 231, 0.2)
}
# Hexagon bottom left
label {
    monitor =
    text = ⬢
    color = rgba(139, 213, 202, 0.4)
    font_size = 49
    font_family = $font
    position = -280, -350
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(139, 213, 202, 0.2)
}
# Star bottom right
label {
    monitor =
    text = ✦
    color = rgba(250, 227, 176, 0.6)
    font_size = 39
    font_family = $font
    position = 280, -350
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(250, 227, 176, 0.2)
}
# ==============================================================================
# YOU KNOW
# ==============================================================================
label {
    monitor =
    text = cmd[update:8000] exec ~/.config/hypr/scripts/random_proverb.sh
    color = $pink
    font_size = 20
    font_family = $font
    position = 0, -310
    halign = center
    valign = center
    text_align = center
    shadow_passes = 3
    shadow_size = 7
    shadow_color = rgba(245, 194, 231, 0.4)
}
# ==============================================================================
# AVATAR
# ==============================================================================
# Avatar outer glow
image {
    monitor =
    path = $HOME/Pictures/profile.jpg
    size = 133
    border_size = 1
    border_color = rgba(203, 166, 247, 0.2)
    position = 0, -11
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 21
    shadow_color = rgba(203, 166, 247, 0.15)
}
# Avatar
image {
    monitor =
    path = $HOME/Pictures/profile.jpg
    size = 112
    border_size = 4
    border_color = $accent
    position = 0, -14
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 11
    shadow_color = rgba(139, 125, 255, 0.5)
}
# ==============================================================================
# WELCOME MESSAGE
# ==============================================================================
label {
    monitor =
    text = Welcome back, $USER
    color = $text
    font_size = 25
    font_family = $font
    position = 0, -112
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(203, 166, 247, 0.3)
}
# ==============================================================================
# INPUT FIELD
# ==============================================================================
input-field {
    monitor =
    size = 392, 63
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = Password...
    hide_input = false
    check_color = $green
    fail_color = $red
    fail_text = Authentication Failed! ($ATTEMPTS)
    capslock_color = $yellow
    position = 0, -216
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(139, 125, 255, 0.4)
}
# ==============================================================================
# CORNER
# ==============================================================================
# Top left corner
label {
    monitor =
    text = ╭─
    color = rgba(203, 166, 247, 0.6)
    font_size = 28
    font_family = JetBrains Mono
    position = 21, -21
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(203, 166, 247, 0.3)
}
# Top right corner
label {
    monitor =
    text = ─╮
    color = rgba(203, 166, 247, 0.6)
    font_size = 28
    font_family = JetBrains Mono
    position = -21, -21
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(203, 166, 247, 0.3)
}
# Bottom left corner
label {
    monitor =
    text = ╰─
    color = rgba(203, 166, 247, 0.6)
    font_size = 28
    font_family = JetBrains Mono
    position = 21, 21
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(203, 166, 247, 0.3)
}
# Bottom right corner
label {
    monitor =
    text = ─╯
    color = rgba(203, 166, 247, 0.6)
    font_size = 28
    font_family = JetBrains Mono
    position = -21, 21
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(203, 166, 247, 0.3)
}
# ==============================================================================
# GLOW SHIT
# ==============================================================================
# Central glow
label {
    monitor =
    text = ●
    color = rgba(203, 166, 247, 0.05)
    font_size = 560
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
}
# Side glows
label {
    monitor =
    text = ●
    color = rgba(245, 194, 231, 0.03)
    font_size = 280
    font_family = $font
    position = -420, 0
    halign = center
    valign = center
}
label {
    monitor =
    text = ●
    color = rgba(139, 213, 202, 0.03)
    font_size = 280
    font_family = $font
    position = 420, 0
    halign = center
    valign = center
}
# ==============================================================================
# BOTTOM
# ==============================================================================
# System uptime - bottom left
label {
    monitor =
    text = cmd[update:60000] uptime -p | sed 's/up /⏱️ /'
    color = $green
    font_size = 17
    font_family = $font
    position = 42, 49
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(166, 227, 161, 0.4)
}
# Network status - bottom right
label {
    monitor =
    text = cmd[update:5000] curl -s --head --connect-timeout 0.5 https://www.bing.com/ &>/dev/null && echo "● Connected" || echo "○ Offline"
    color = $blue
    font_size = 17
    font_family = $font
    position = -42, 49
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(137, 220, 235, 0.4)
}
